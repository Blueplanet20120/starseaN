name: Build Release APKs

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Override output file version name, for example 1.0.1"
        required: false
        type: string
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build And Publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      REQUESTED_VERSION_NAME: ${{ github.event.inputs.version_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore last release version cache
        uses: actions/cache/restore@v4
        with:
          path: .last-release-version
          key: last-release-version-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            last-release-version-${{ github.ref_name }}-

      - name: Read ProjectConfig version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          is_semver() {
            [[ "$1" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          }

          increment_patch() {
            local major minor patch
            IFS=. read -r major minor patch <<< "$1"
            echo "${major}.${minor}.$((10#$patch + 1))"
          }

          version_name="$(sed -n 's/^[[:space:]]*VERSION_NAME=//p' version.properties | head -n 1 | tr -d '\r')"
          if [ -z "$version_name" ]; then
            echo "::error::Unable to read VERSION_NAME from version.properties."
            exit 1
          fi

          original_version="$version_name"
          if [ -n "${REQUESTED_VERSION_NAME:-}" ]; then
            version_name="$REQUESTED_VERSION_NAME"
            original_version="$version_name"
          fi

          is_release=false
          if is_semver "$version_name"; then
            is_release=true
            echo "Detected formal release version: $version_name"
          else
            echo "::notice::VERSION_NAME is '$version_name', not strict x.y.z. GitHub Release creation will be skipped."
          fi

          create_github_release=false
          if [ "$is_release" = "true" ] && { [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$GITHUB_REF" = "refs/heads/main" ]; }; then
            create_github_release=true
          fi

          if [ "$create_github_release" = "true" ]; then
            git fetch --tags --force origin

            cached=""
            if [ -f .last-release-version ]; then
              cached="$(tr -d '[:space:]' < .last-release-version)"
            fi
            if is_semver "$cached"; then
              echo "Restored last release version cache: $cached"
              if [ "$cached" = "$version_name" ]; then
                version_name="$(increment_patch "$cached")"
                echo "::notice::Cache already published $cached; bumping VERSION_NAME to $version_name."
              elif [ "$(printf '%s\n%s\n' "$version_name" "$cached" | sort -V | tail -n1)" = "$cached" ]; then
                version_name="$cached"
                echo "::notice::Cache last version $cached is newer than $original_version; starting from cache."
                version_name="$(increment_patch "$version_name")"
                echo "::notice::Bumping VERSION_NAME to $version_name for this run."
              fi
            fi

            current_sha="$(git rev-parse HEAD)"
            bumps=0
            while [ "$bumps" -lt 50 ]; do
              tag_name="v$version_name"
              if ! git rev-parse -q --verify "refs/tags/$tag_name" >/dev/null; then
                break
              fi
              tag_sha="$(git rev-list -n 1 "$tag_name")"
              if [ "$tag_sha" = "$current_sha" ]; then
                echo "Tag $tag_name already exists on the current commit."
                break
              fi
              next="$(increment_patch "$version_name")"
              echo "::notice::Tag $tag_name already exists at $tag_sha; bumping VERSION_NAME $version_name -> $next."
              version_name="$next"
              bumps=$((bumps + 1))
            done
            if [ "$bumps" -ge 50 ]; then
              echo "::error::Unable to find a free VERSION_NAME after 50 increments."
              exit 1
            fi

            if [ "$version_name" != "$original_version" ]; then
              printf 'VERSION_NAME=%s\n' "$version_name" > version.properties
              echo "Wrote version.properties VERSION_NAME=$version_name for this build."
            fi
          fi

          printf '%s\n' "$version_name" > .last-release-version

          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$version_name" >> "$GITHUB_OUTPUT"
          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"
          echo "create_github_release=$create_github_release" >> "$GITHUB_OUTPUT"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action defaults to `tools platform-tools`, but the legacy `tools`
          # package is no longer published: sdkmanager now fails with
          # "Failed to find package 'tools'" and the job never reaches Gradle.
          # The step below installs whatever platform, build-tools and NDK the
          # project asks for, so only platform-tools is needed here.
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          licenses_status="${PIPESTATUS[1]}"
          set -o pipefail
          if [ "$licenses_status" -ne 0 ]; then
            echo "::error::Failed to accept Android SDK licenses."
            exit "$licenses_status"
          fi

          target_sdk="$(sed -n 's/^[[:space:]]*const val TARGET_SDK = \([0-9]\+\).*/\1/p' buildSrc/src/main/kotlin/BuildConfig.kt | head -n 1)"
          if [ -z "$target_sdk" ]; then
            echo "::error::Unable to read ProjectConfig.TARGET_SDK from buildSrc/src/main/kotlin/BuildConfig.kt."
            exit 1
          fi

          available_packages="$(sdkmanager --list | awk '{ print $1 }')"
          platform_package="platforms;android-${target_sdk}"
          if ! grep -Fxq "$platform_package" <<< "$available_packages"; then
            if grep -Fxq "platforms;android-${target_sdk}.0" <<< "$available_packages"; then
              platform_package="platforms;android-${target_sdk}.0"
            else
              echo "::error::No Android SDK platform package is available for TARGET_SDK=$target_sdk."
              exit 1
            fi
          fi

          build_tools_package="$(printf '%s\n' "$available_packages" | awk '$1 ~ /^build-tools;[0-9]/ { print $1 }' | sort -V | tail -n 1)"
          ndk_package="$(printf '%s\n' "$available_packages" | awk '$1 ~ /^ndk;[0-9]/ { print $1 }' | sort -V | tail -n 1)"

          if [ -z "$build_tools_package" ]; then
            echo "::error::No Android build-tools package is available from sdkmanager."
            exit 1
          fi
          if [ -z "$ndk_package" ]; then
            echo "::error::No Android NDK package is available from sdkmanager."
            exit 1
          fi

          sdkmanager --install "$platform_package" "$build_tools_package" "$ndk_package"

          ndk_version="${ndk_package#ndk;}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk_version" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ndk_version" >> "$GITHUB_ENV"

      - name: Validate signing secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing repository secret RELEASE_KEYSTORE_BASE64."
            exit 1
          fi
          if [ -z "${RELEASE_KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::Missing repository secret RELEASE_KEYSTORE_PASSWORD."
            exit 1
          fi
          if [ -z "${RELEASE_KEY_ALIAS:-}" ]; then
            echo "::error::Missing repository secret RELEASE_KEY_ALIAS."
            exit 1
          fi

      - name: Build release APKs
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Sign release APKs
        shell: bash
        run: |
          set -euo pipefail

          keystore_path="$RUNNER_TEMP/release.keystore"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"

          key_password="${RELEASE_KEY_PASSWORD:-$RELEASE_KEYSTORE_PASSWORD}"
          export RELEASE_KEYSTORE_PASSWORD
          export RELEASE_KEY_PASSWORD="$key_password"

          zipalign="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

          if [ -z "$zipalign" ]; then
            echo "::error::zipalign was not found in Android build-tools."
            exit 1
          fi
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner was not found in Android build-tools."
            exit 1
          fi

          mkdir -p signed-apks
          shopt -s nullglob
          for apk in app/build/outputs/apk/release/*.apk; do
            base_name="$(basename "$apk" .apk)"
            aligned_apk="$RUNNER_TEMP/${base_name}-aligned.apk"
            signed_apk="signed-apks/${base_name}-signed.apk"

            "$zipalign" -p -f 4 "$apk" "$aligned_apk"
            "$apksigner" sign \
              --ks "$keystore_path" \
              --ks-pass env:RELEASE_KEYSTORE_PASSWORD \
              --ks-key-alias "$RELEASE_KEY_ALIAS" \
              --key-pass env:RELEASE_KEY_PASSWORD \
              --out "$signed_apk" \
              "$aligned_apk"
            "$apksigner" verify --verbose "$signed_apk"
          done

          if ! find signed-apks -type f -name "*.apk" | grep -q .; then
            echo "::error::No signed release APKs were produced."
            exit 1
          fi

      - name: Collect release APKs
        id: collect
        shell: bash
        env:
          CONFIG_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          CREATE_GITHUB_RELEASE: ${{ steps.version.outputs.create_github_release }}
        run: |
          set -euo pipefail

          ref_version_name="${GITHUB_REF_NAME#v}"
          version_name="${REQUESTED_VERSION_NAME:-}"

          if [ -z "$version_name" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "$ref_version_name" != "$GITHUB_REF_NAME" ]; then
            version_name="$ref_version_name"
          fi
          if [ -z "$version_name" ]; then
            version_name="$CONFIG_VERSION_NAME"
          fi

          version_code="$(git rev-list --count HEAD)"
          mkdir -p release-artifacts github-release-artifacts

          shopt -s nullglob
          for apk in signed-apks/*.apk; do
            file_name="$(basename "$apk")"
            abi="universal"
            case "$file_name" in
              *arm64-v8a*) abi="arm64-v8a" ;;
              *armeabi-v7a*) abi="armeabi-v7a" ;;
              *x86_64*) abi="x86_64" ;;
              *x86*) abi="x86" ;;
              *universal*) abi="universal" ;;
            esac

            cp "$apk" "release-artifacts/starseaN_${version_name}-${version_code}-${abi}.apk"
            cp "$apk" "github-release-artifacts/starseaN-${abi}.apk"
          done

          if ! find release-artifacts -type f -name "*.apk" | grep -q .; then
            echo "::error::No release APKs were found under signed-apks."
            exit 1
          fi
          if ! find github-release-artifacts -type f -name "*.apk" | grep -q .; then
            echo "::error::No GitHub Release APKs were found under signed-apks."
            exit 1
          fi

          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          ls -lh release-artifacts
          ls -lh github-release-artifacts

      - name: Upload arm64-v8a APK artifact
        uses: actions/upload-artifact@v7
        with:
          path: release-artifacts/*-arm64-v8a.apk
          if-no-files-found: error
          archive: false

      - name: Create tag and release notes
        if: steps.version.outputs.create_github_release == 'true'
        id: release_info
        shell: bash
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.collect.outputs.version_code }}
        run: |
          set -euo pipefail

          current_sha="$(git rev-parse HEAD)"
          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "$TAG_NAME")"
            if [ "$tag_sha" != "$current_sha" ]; then
              echo "::error::Tag $TAG_NAME already exists at $tag_sha, but this workflow is running at $current_sha."
              exit 1
            fi
            echo "Tag $TAG_NAME already exists on the current commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME" "$current_sha"
            git push origin "refs/tags/$TAG_NAME"
          fi

          mapfile -t release_tags < <(
            git for-each-ref --format='%(refname:short)' refs/tags |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true
          )

          previous_candidates="$(mktemp)"
          for candidate in "${release_tags[@]}"; do
            if [ "$candidate" = "$TAG_NAME" ]; then
              continue
            fi
            if git merge-base --is-ancestor "$candidate" "$current_sha"; then
              count="$(git rev-list --count "${candidate}..${current_sha}")"
              printf '%s\t%s\n' "$count" "$candidate" >> "$previous_candidates"
            fi
          done

          previous_tag=""
          if [ -s "$previous_candidates" ]; then
            previous_tag="$(sort -n "$previous_candidates" | head -n 1 | cut -f2-)"
          fi

          range="$current_sha"
          if [ -n "$previous_tag" ]; then
            range="${previous_tag}..${current_sha}"
          fi

          tmp_changes="$(mktemp)"
          git log --reverse --no-merges --pretty=format:"- %s ([%h](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/%H))" "$range" > "$tmp_changes"
          if [ ! -s "$tmp_changes" ]; then
            git log --reverse --pretty=format:"- %s ([%h](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/%H))" "$range" > "$tmp_changes"
          fi

          {
            echo "## starseaN $TAG_NAME"
            echo
            echo "- Version name: $VERSION_NAME"
            echo "- Version code: $VERSION_CODE"
            echo

            if [ -n "$previous_tag" ]; then
              echo "### Changes since $previous_tag"
              echo
              echo "[Compare $previous_tag...$TAG_NAME](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${previous_tag}...${TAG_NAME})"
            else
              echo "### Changes"
            fi
            echo

            if [ -s "$tmp_changes" ]; then
              cat "$tmp_changes"
              echo
            else
              echo "- No commit changes found."
            fi

            echo
            echo "### APK artifacts"
            echo
            find github-release-artifacts -maxdepth 1 -type f -name "*.apk" -printf "- %f\n" | sort
          } > release-notes.md

          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          cat release-notes.md

      - name: Create GitHub Release
        if: steps.version.outputs.create_github_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" github-release-artifacts/*.apk --clobber
            gh release edit "$TAG_NAME" \
              --title "starseaN $TAG_NAME" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$TAG_NAME" github-release-artifacts/*.apk \
              --title "starseaN $TAG_NAME" \
              --notes-file release-notes.md \
              --latest
          fi

      - name: Save last release version cache
        if: success() && steps.version.outputs.create_github_release == 'true'
        uses: actions/cache/save@v4
        with:
          path: .last-release-version
          key: last-release-version-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prune old workflow runs and releases
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_WORKFLOW_RUNS: "5"
          KEEP_RELEASES: "8"
        run: |
          set -euo pipefail

          mapfile -t run_ids < <(
            gh run list --workflow release.yml --limit 100 --json databaseId --jq '.[].databaseId'
          )
          if (( ${#run_ids[@]} > KEEP_WORKFLOW_RUNS )); then
            for run_id in "${run_ids[@]:KEEP_WORKFLOW_RUNS}"; do
              echo "Deleting workflow run $run_id"
              gh run delete "$run_id" || true
            done
          fi

          mapfile -t release_tags < <(
            gh release list --limit 100 --json tagName,createdAt \
              --jq 'sort_by(.createdAt) | reverse | .[].tagName'
          )
          if (( ${#release_tags[@]} > KEEP_RELEASES )); then
            for tag in "${release_tags[@]:KEEP_RELEASES}"; do
              echo "Deleting GitHub release $tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            done
          fi
